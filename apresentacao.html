<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">

    <title>APRESENTAÇÃO</title>
</head>

<body>

    <header class="cabecalho-principal">
        <div class="container-header">
            <!-- Logo / Brand na Esquerda (Foto + Texto) -->
            <a href="index.html" class="logo">
                <img src="logo-educador-financeiro.png" alt="Luís Holanda" class="foto-perfil-nav">
                <div class="texto-logo">
                    Luís Holanda <span>Educação Financeira</span>
                </div>
            </a>

            <!-- Botão Hambúrguer (Mobile) -->
            <button class="menu-hamburguer" id="btn-menu" aria-label="Abrir Menu">
                <i class="fa-solid fa-bars"></i>
            </button>

            <!-- Links de Navegação -->
            <nav class="nav-menu" id="nav-menu">
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                    <li><a href="index.html#feedback">Feedback</a></li>
                    <li><a href="index.html#contato">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="secao-apresentacao-pagina">
        <div class="container-apresentacao-pagina">
            <!-- Lado Esquerdo: O Vídeo -->
            <div class="video-apresentacao">
                <iframe width="100%" height="450"
                    src="https://www.youtube-nocookie.com/embed/oihjrqYwKvw?si=jep2NDLyHkLzs1rm"
                    title="Vídeo de Apresentação" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <!-- Botões Corrigidos (Sem a tag <button> por fora e um abaixo do outro) -->
        <div class="container-botoes-pilares">
            <a href="pilar1.html" class="botao-pilar">Pilar 1</a>
            <a href="pilar2.html" class="botao-pilar">Pilar 2</a>
            <a href="pilar3.html" class="botao-pilar">Pilar 3</a>
            <a href="pilar4.html" class="botao-pilar">Pilar 4</a>
        </div>
    </section>

    <script>
        const btnMenu = document.getElementById('btn-menu');
        const navMenu = document.getElementById('nav-menu');

        if (btnMenu && navMenu) {
            btnMenu.addEventListener('click', () => {
                navMenu.classList.toggle('ativo');
            });

            const linksMenu = document.querySelectorAll('.nav-menu a');
            linksMenu.forEach(link => {
                link.addEventListener('click', () => {
                    navMenu.classList.remove('ativo');
                });
            });
        }
    </script>


</body>

</html>
